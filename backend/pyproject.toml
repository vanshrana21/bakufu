[project]
name = "manganese-prospectivity"
version = "0.1.0"
description = "ML-driven prospectivity mapping for manganese deposits in India (SIH26009)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
